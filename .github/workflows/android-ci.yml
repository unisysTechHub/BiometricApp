name: Android CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:

      ####################################################
      # Checkout Repositories
      ####################################################

      - name: Checkout BiometricApp
        uses: actions/checkout@v4

      # Remove token if repositories are public
      - name: Checkout API Repository
        uses: actions/checkout@v4
        with:
          repository: unisystechhub/API
          path: API
          token: ${{ secrets.GH_PAT }}

      - name: Checkout Compose Repository
        uses: actions/checkout@v4
        with:
          repository: unisystechhub/Compose
          path: Compose
          token: ${{ secrets.GH_PAT }}

      ####################################################
      # Show Workspace
      ####################################################

      - name: Show Workspace Layout
        run: |
          echo "Workspace = $GITHUB_WORKSPACE"
          pwd
          ls -la
          echo "-----------------------"
          find . -maxdepth 2 -type d
          echo "-----------------------"
          find . -name gradlew
          echo "-----------------------"
          find . -name settings.gradle -o -name settings.gradle.kts

      ####################################################
      # Setup Java
      ####################################################

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      ####################################################
      # Setup Android SDK
      ####################################################

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      ####################################################
      # Gradle Permission
      ####################################################

      - name: Make Gradle Executable
        run: chmod +x gradlew

      ####################################################
      # Verify Environment
      ####################################################

      - name: Verify Java
        run: java -version

      - name: Verify Gradle
        run: ./gradlew --version

      ####################################################
      # Download Dependencies
      ####################################################

      - name: Download Dependencies
        run: ./gradlew dependencies

      ####################################################
      # Verify Project
      ####################################################

      - name: Verify Gradle Project
        run: ./gradlew help

      ####################################################
      # Clean
      ####################################################

      - name: Clean Project
        run: ./gradlew clean

      ####################################################
      # Assemble APK
      ####################################################

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      ####################################################
      # Unit Tests
      ####################################################

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      ####################################################
      # Publish Unit Test Results
      ####################################################

      - name: Publish Unit Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Android Unit Tests
          path: '**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      ####################################################
      # Espresso Tests
      ####################################################

      - name: Run Espresso Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest

      ####################################################
      # Android Lint
      ####################################################

      - name: Run Android Lint
        run: ./gradlew lintDebug

      ####################################################
      # JaCoCo
      ####################################################

      - name: Generate JaCoCo Report
        run: ./gradlew jacocoTestReport

      ####################################################
      # Upload APK
      ####################################################

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk

      ####################################################
      # Upload Lint Report
      ####################################################

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LintReport
          path: app/build/reports

      ####################################################
      # Upload JaCoCo Reports
      ####################################################

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JaCoCo
          path: |
            **/jacocoTestReport.xml
            **/jacocoHtml

      ####################################################
      # Upload Test XMLs
      ####################################################

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestReports
          path: '**/TEST-*.xml'
