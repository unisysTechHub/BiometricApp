name: Android CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:

      ####################################################
      # Checkout Repositories
      ####################################################

      - name: Checkout BiometricApp
        uses: actions/checkout@v4

      # Remove token if repositories are public
      - name: Checkout API Repository
        uses: actions/checkout@v4
        with:
          repository: unisystechhub/API
          path: ${{ github.workspace }}/API
          token: ${{ secrets.GH_PAT }}

      - name: Checkout Compose Repository
        uses: actions/checkout@v4
        with:
          repository: unisystechhub/Compose
          path: ${{ github.workspace }}/Compose
          token: ${{ secrets.GH_PAT }}

      ####################################################
      # Show Workspace
      ####################################################

      - name: Show Workspace Layout
        run: |
          echo "Workspace = $GITHUB_WORKSPACE"
          pwd
          ls -la
          echo "-----------------------"
          find . -maxdepth 2 -type d
          echo "-----------------------"
          find . -name gradlew
          echo "-----------------------"
          find . -name settings.gradle -o -name settings.gradle.kts

      ####################################################
      # Setup Java
      ####################################################

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      ####################################################
      # Setup Android SDK
      ####################################################

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      ####################################################
      # Gradle Permission
      ####################################################

      - name: Make Gradle Executable
        run: chmod +x gradlew

      ####################################################
      # Verify Environment
      ####################################################

      - name: Verify Java
        run: java -version

      - name: Verify Gradle
        run: ./gradlew --version

      ####################################################
      # Download Dependencies
      ####################################################

      - name: Download Dependencies
        run: ./gradlew dependencies

      ####################################################
      # Verify Project
      ####################################################

      - name: Verify Gradle Project
        run: ./gradlew help

      ####################################################
      # Clean
      ####################################################

      - name: Clean Project
        run: ./gradlew clean

      ####################################################
      # Assemble APK
      ####################################################

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace
      ####################################################
      # Assemble APK
      ####################################################
      - name:  Android Test APK
        run: ./gradlew  assembleDebugAndroidTest --stacktrace
      ####################################################
      # upload APK
      ####################################################
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk

      ####################################################
      # Unit Tests
      ####################################################

      - name: Run Unit Tests
        if: false
        run: ./gradlew testDebugUnitTest

      ####################################################
      # Publish Unit Test Results
      ####################################################

      - name: Publish Unit Test Results
        if: false
        uses: dorny/test-reporter@v2
        with:
          name: Android Unit Tests
          path: '**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

  esproesso_tests:
    name: Espresso API ${{ matrix.api_level }}

    strategy:
      matrix:
        api_level: [ 31, 32, 33, 34 ]

    runs-on: ubuntu-latest
    needs: build

    steps:

      ####################################################
      # Download APKs built by the build job
      ####################################################

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: APK-${{ github.run_id }}


      ####################################################
      # Enable KVM
      ####################################################

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      ####################################################
      # Start emulator and execute prebuilt APKs
      ####################################################

      - name: Run Espresso Tests API-${{ matrix.api_level }}
        env:
          TEST_PACKAGE: ${{ vars.BIOMETRIC_APP_TEST_PACKAGE }}
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim

          script: |
            echo "Installing application APK..."
            adb install app-debug.apk

            echo "Installing instrumentation test APK..."
            adb install app-debug-androidTest.apk

            echo "Running Espresso tests..."
            adb shell am instrument -w \
             "$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"


